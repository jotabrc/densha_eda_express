services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_densha
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_DB: ${DENSHA_DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DENSHA_POSTGRES_PASSWORD}
    ports:
      - "${DENSHA_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ../.certs:/certs:ro
      - ../docker-entrypoint-initdb.d/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a
        [ -f /certs/../.env ] && . /certs/../.env # Importa as variáveis no shell do container
        set +a

        cp /certs/server.crt /var/lib/postgresql/server.crt
        cp /certs/server.key /var/lib/postgresql/server.key
        cp /certs/ca.crt /var/lib/postgresql/ca.crt
        chmod 600 /var/lib/postgresql/server.key
        chmod 644 /var/lib/postgresql/server.crt /var/lib/postgresql/ca.crt
        chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt /var/lib/postgresql/ca.crt
        
        if [ -d /var/lib/postgresql/data/base ]; then
          cp /docker-entrypoint-initdb.d/pg_hba.conf /var/lib/postgresql/data/pg_hba.conf
          chmod 600 /var/lib/postgresql/data/pg_hba.conf
          chown postgres:postgres /var/lib/postgresql/data/pg_hba.conf
        fi

        # Substitui variáveis mantendo a segurança
        envsubst '${DENSHA_FLYWAY_DB_PASSWORD} ${DENSHA_APP_DB_PASSWORD}' < /docker-entrypoint-initdb.d/init.sql > /docker-entrypoint-initdb.d/01-init-users.sql

        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c ssl_min_protocol_version=TLSv1.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${DENSHA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local